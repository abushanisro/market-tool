# Source registry seed.
#
# verification_status:
#   verified          URL + format confirmed by a live request on the verification date
#   url_verified      the dataset/page URL was confirmed, but the full download/parse was not exercised live
#   documented        access rules come from official docs; endpoint not exercised live
#   key_required      verified to exist, needs an API key (set the env var named in auth_env_var)
#   planned           candidate integration; URL/terms not yet confirmed — never auto-scheduled
#   blocked_by_terms  terms/licensing forbid crawling or reuse — the platform refuses to run it
#
# Verification evidence: docs/SOURCES.md (checked 2026-10-27).
# extraction.fetch_engine: go   run the job on the Go fetch worker (go-fetcher/); falls back to Scrapy if the binary is not configured
# URL templates: {today} {year} {start_date} {end_date} {page} {contact_email}

defaults:
  concurrency: 1
  download_delay: 1.0
  max_pages: 50
  max_depth: 1
  respect_robots: true
  freshness_sla_hours: 72

sources:
  # ------------------------------------------------------------------ FX
  - slug: frankfurter-fx
    name: "Frankfurter: ECB reference exchange rates"
    base_url: https://api.frankfurter.dev
    website_category: open_api
    source_type: api
    data_kinds: [fx]
    categories: ["*"]
    countries: [USA, IND, CHN, JPN, KOR, MEX, DEU, CZE, HUN, MYS, SGP, CAN, BRA, GBR]
    access_method: "HTTPS GET, JSON, no key"
    license: "Free incl. commercial use (Frankfurter terms); rates originate from ECB/central banks"
    license_url: https://frankfurter.dev
    commercial_use: "yes"
    attribution: "Exchange rates: Frankfurter (ECB reference rates)"
    verification_status: verified
    verified_at: 2026-10-27
    update_frequency: daily (TARGET business days ~16:00 CET)
    reliability: 0.95
    status: active
    schedule_cron: "*/10 13-17 * * 1-5"   # UTC: poll the ECB publish window (~16:00 CET); unchanged polls cost one conditional GET
    allowed_domains: [api.frankfurter.dev, api.frankfurter.app]
    start_urls: ["https://api.frankfurter.dev/v1/latest?base=USD"]
    extraction: {parser: frankfurter, fetch_engine: go}
    backfill:
      url_template: "https://api.frankfurter.dev/v1/{start_date}..{end_date}?base=USD"
      chunk_days: 365
    freshness_sla_hours: 96
    notes: "api.frankfurter.app redirects (302) to api.frankfurter.dev. Cache locally as requested by the provider."

