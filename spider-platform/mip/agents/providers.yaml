# OpenAI-compatible chat endpoints. Keys are read from the environment variable named in `key_env`
# (never stored in the database or shown in the UI). Model ids are NOT hard-coded: model names change often and
# differ per provider, so pick them from the provider's own list (Agent Intelligence -> Model setup -> Discover).
#
# local: true  -> runs on this machine / LAN; internal (taxonomy) data may be sent to it.
# Endpoints below are each provider's documented OpenAI-compatible base URL; verify against the provider's docs
# when adding a key. Add your own provider by appending an entry.
providers:
  ollama:      {label: "Ollama (local)",          base_url: "http://127.0.0.1:11434/v1", local: true}
  lmstudio:    {label: "LM Studio (local)",       base_url: "http://127.0.0.1:1234/v1",  local: true}
  openrouter:  {label: "OpenRouter",              base_url: "https://openrouter.ai/api/v1",                       key_env: MIP_KEY_OPENROUTER, rpm: 15}
  google:      {label: "Google AI Studio",        base_url: "https://generativelanguage.googleapis.com/v1beta/openai", key_env: MIP_KEY_GOOGLE_AI, rpm: 10}
  nvidia:      {label: "NVIDIA NIM (build.nvidia.com)", base_url: "https://integrate.api.nvidia.com/v1",          key_env: MIP_KEY_NVIDIA, rpm: 20}
  groq:        {label: "Groq",                    base_url: "https://api.groq.com/openai/v1",                     key_env: MIP_KEY_GROQ, rpm: 20}
  cerebras:    {label: "Cerebras",                base_url: "https://api.cerebras.ai/v1",                         key_env: MIP_KEY_CEREBRAS, rpm: 20}
  mistral:     {label: "Mistral La Plateforme",   base_url: "https://api.mistral.ai/v1",                          key_env: MIP_KEY_MISTRAL, rpm: 10}
  huggingface: {label: "Hugging Face router",     base_url: "https://router.huggingface.co/v1",                   key_env: MIP_KEY_HUGGINGFACE, rpm: 10}
