<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emithran MIP — Manufacturing Data Spider</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9e8a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Sora:wght@600;700&display=swap">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div><div class="brand-name">Emithran MIP</div><div class="brand-sub">Manufacturing Data Spider</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"><span class="dot"></span>Connecting…</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="global-search" placeholder="Search materials, grades, designations…" autocomplete="off">
      </div>
      <div class="spacer"></div>
      <div class="ticker" id="ticker"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="drawer-back" id="drawer-back"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-h"><div id="drawer-title"></div><button class="btn ghost" id="drawer-close" aria-label="Close">✕</button></div><div class="drawer-b" id="drawer-body"></div></aside>
<div class="modal" id="modal"><div class="modal-card" id="modal-card"></div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<script src="/assets/charts.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/views-ops.js"></script>
<script src="/assets/views-intel.js"></script>
</body>
</html>
